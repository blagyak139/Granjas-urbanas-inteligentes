name: Deploy Lambda

on:
  push:
    branches:
      - master
    paths:
      - 'backend/lambda/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install pytest pytest-mock boto3

      - name: Ejecutar pruebas
        run: |
          cp backend/lambda/lambda_solid_v2.py backend/lambda/lambda_solid.py
          cd backend
          PYTHONPATH=lambda python3 -m pytest tests/test_lambda_solid.py -v

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Empaquetar Lambda
        run: |
          cd backend/lambda
          zip -r lambda.zip lambda_solid_v2.py

      - name: Desplegar en AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name guardar-medida-sensor \
            --zip-file fileb://backend/lambda/lambda.zip
